<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>うるさい</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="うるさい — японский для мамы: хирагана, катакана, первая грамматика, числа, кафе и время в играх.">
<meta name="theme-color" content="#FF4F86">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="うるさい"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<style>/* Layout: one column "candy shop" app — sticky top bar, slide-out drawer, colored unit bands, game stage overlay */
:root{
  --bg:#FFF3F1; --bg2:#FFE6E3; --card:#FFFFFF; --ink:#3A2240; --muted:#86697F; --line:#F3D6D8;
  --pink:#FF4F86; --orange:#FF9A1F; --yellow:#FFCB2E; --green:#22B97F; --teal:#14AFC0; --blue:#3B8EF0; --grape:#9A5CF0; --red:#F04A4A;
  --pink-s:#FFE1EB; --orange-s:#FFEBD2; --yellow-s:#FFF4CC; --green-s:#D8F6E8; --teal-s:#D5F4F7; --blue-s:#DFEBFF; --grape-s:#EEE3FF;
  --ok:#1FAE6E; --ok-s:#DDF7EA; --bad:#E5484D; --bad-s:#FFE3E3;
  --shadow:0 10px 30px -14px rgba(120,40,80,.35);
  --f-jp:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-ru:"Nunito","Segoe UI",system-ui,sans-serif;
  --f-pen:"Klee One","M PLUS Rounded 1c","Hiragino Mincho ProN",serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D1426; --bg2:#271B33; --card:#2C2039; --ink:#FBEFF7; --muted:#BCA6C2; --line:#3E2F4E;
  --pink:#FF6B9A; --orange:#FFAA3D; --yellow:#FFD34F; --green:#38CF93; --teal:#2EC4D4; --blue:#5FA3FF; --grape:#B184FF; --red:#FF6464;
  --pink-s:#46213A; --orange-s:#47301A; --yellow-s:#433A17; --green-s:#173D31; --teal-s:#153B42; --blue-s:#1D2D4D; --grape-s:#30234D;
  --ok:#3DD394; --ok-s:#173D2D; --bad:#FF6B70; --bad-s:#4A1F24; --shadow:0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1426; --bg2:#271B33; --card:#2C2039; --ink:#FBEFF7; --muted:#BCA6C2; --line:#3E2F4E;
  --pink:#FF6B9A; --orange:#FFAA3D; --yellow:#FFD34F; --green:#38CF93; --teal:#2EC4D4; --blue:#5FA3FF; --grape:#B184FF; --red:#FF6464;
  --pink-s:#46213A; --orange-s:#47301A; --yellow-s:#433A17; --green-s:#173D31; --teal-s:#153B42; --blue-s:#1D2D4D; --grape-s:#30234D;
  --ok:#3DD394; --ok-s:#173D2D; --bad:#FF6B70; --bad-s:#4A1F24; --shadow:0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ru);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--card)}
button{font:inherit;color:inherit}
.jp{font-family:var(--f-jp)}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
ruby{ruby-position:over}
rt{font-family:var(--f-jp);font-size:.5em;font-weight:700;color:var(--muted);letter-spacing:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:10px}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--card);border-bottom:2px solid var(--line);
  display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;background:var(--bg2);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:24px;height:24px}
.logo{display:flex;align-items:baseline;gap:6px;text-decoration:none;color:inherit;min-width:0}
.logo b{font-family:var(--f-jp);font-weight:800;font-size:26px;letter-spacing:.02em;line-height:1}
.logo b span:nth-child(1){color:var(--pink)}.logo b span:nth-child(2){color:var(--orange)}.logo b span:nth-child(3){color:var(--green)}.logo b span:nth-child(4){color:var(--blue)}
.logo small{font-weight:800;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.spacer{flex:1}
.chipsbadge{display:flex;align-items:center;gap:6px;background:var(--yellow-s);border-radius:999px;padding:4px 12px 4px 4px;font-weight:900;cursor:pointer;border:0;font-variant-numeric:tabular-nums}
.chipsbadge svg{width:34px;height:34px}
.chipsbadge small{font-weight:800;color:var(--muted);font-size:12px}
.chipsbadge.bump{animation:bump .45s}
@keyframes bump{30%{transform:scale(1.18)}60%{transform:scale(.95)}}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(40,10,40,.38);z-index:70;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:80;top:0;bottom:0;left:0;width:min(320px,86vw);background:var(--card);transform:translateX(-105%);transition:transform .3s cubic-bezier(.2,.9,.3,1.1);
  overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
.drawer.on{transform:none}
.drawer h4{margin:18px 8px 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:16px;text-decoration:none;color:inherit;font-weight:800}
.nav a:hover{background:var(--bg2)}
.nav a.cur{background:var(--bg2)}
.nav .dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-jp);font-weight:800;font-size:18px;color:#fff;flex:none}
.nav .meta{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.nav .meta small{color:var(--muted);font-weight:700;font-size:12px}
.nav .pct{margin-left:auto;font-size:12px;color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}

/* ---------- page ---------- */
main{max-width:780px;margin:0 auto;padding-block:16px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:14px}
.band{border-radius:28px;padding:20px 20px 18px;color:#fff;position:relative;overflow:hidden}
.band h1{font-size:28px;font-weight:900}
.band p{margin:6px 0 0;opacity:.95;font-weight:700;max-width:52ch}
.band .big{position:absolute;right:-6px;bottom:-26px;font-family:var(--f-jp);font-weight:800;font-size:120px;opacity:.18;line-height:1;pointer-events:none}
.tabs{display:flex;gap:6px;background:var(--bg2);padding:5px;border-radius:18px}
.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:14px;font-weight:900;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 4px 10px -6px rgba(0,0,0,.3)}

/* candy buttons */
.btn{--c:var(--pink);--cd:color-mix(in srgb,var(--c) 70%,#000);border:0;cursor:pointer;background:var(--c);color:#fff;font-weight:900;border-radius:18px;padding:13px 20px;
  box-shadow:0 5px 0 var(--cd);transform:translateY(0);transition:transform .08s,box-shadow .08s;font-size:16px;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cd)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{padding:8px 14px;border-radius:14px;font-size:14px;box-shadow:0 3px 0 var(--cd)}
.btn.ghost.sm{box-shadow:0 3px 0 var(--line)}

/* home */
.hello{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.hello svg.mascot{width:96px;height:auto}
.hello h2{font-size:24px;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border-radius:20px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.stat small{color:var(--muted);font-weight:800;font-size:12px}
.ring{width:54px;height:54px;margin:0 auto 4px;display:block}
.path{display:flex;flex-direction:column;gap:10px}
.station{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:22px;padding:12px;text-decoration:none;color:inherit;box-shadow:var(--shadow);position:relative}
.station .jp-badge{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;color:#fff;font-family:var(--f-jp);font-weight:800;font-size:24px}
.station h3{font-size:17px;font-weight:900}
.station p{margin:2px 0 0;color:var(--muted);font-size:13px;font-weight:700;line-height:1.3}
.bar{height:8px;background:var(--bg2);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--c,var(--green))}
.step-n{font-size:12px;font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums}

/* lesson blocks */
.lesson h2{font-size:21px;font-weight:900;margin-bottom:8px}
.lesson h3{font-size:17px;font-weight:900;margin:14px 0 6px}
.lesson p{margin:6px 0;max-width:62ch}
.formula{font-family:var(--f-jp);font-size:24px;font-weight:800;text-align:center;padding:16px 10px;border-radius:18px;background:var(--bg2);line-height:2.1}
.formula .slot{display:inline-block;border-bottom:3px dashed var(--muted);min-width:64px;margin:0 4px;color:var(--muted);font-family:var(--f-ru);font-size:15px;line-height:1.4;vertical-align:middle}
.ex{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:16px;background:var(--bg)}
.ex .s{font-size:21px;line-height:2.1}
.ex .t{color:var(--muted);font-weight:700;font-size:14px}
.ex-list{display:flex;flex-direction:column;gap:8px}
.note{background:var(--yellow-s);border-radius:16px;padding:10px 14px;font-weight:700;font-size:15px}
.note.pink{background:var(--pink-s)} .note.blue{background:var(--blue-s)} .note.green{background:var(--green-s)}
table.t{border-collapse:separate;border-spacing:4px;font-variant-numeric:tabular-nums}
table.t td,table.t th{background:var(--bg);border-radius:10px;padding:6px 8px;text-align:center;font-family:var(--f-jp);font-weight:700}
table.t th{background:var(--bg2);font-family:var(--f-ru);font-size:13px}
table.t td.hi{background:var(--pink-s);color:var(--pink)}
.scroll-x{overflow-x:auto;max-width:100%}

/* words: tappable */
.w{cursor:pointer;border-radius:8px;padding:0 1px;margin:0 .12em;transition:background .15s;display:inline-block;line-height:inherit;font-family:var(--f-jp)}
.w:hover{background:var(--bg2)}
.w.pt{color:var(--pink);font-weight:800}
.w.cp{color:var(--orange);font-weight:800}
.w.q{color:var(--grape);font-weight:800}
.blank{display:inline-block;min-width:2.2em;border-bottom:3px solid var(--pink);margin:0 .2em;text-align:center;color:var(--pink)}
.say{border:0;background:var(--bg2);border-radius:12px;width:36px;height:36px;display:inline-grid;place-items:center;cursor:pointer;vertical-align:middle;flex:none}
.say svg{width:20px;height:20px}

/* tooltip */
.tip{position:fixed;z-index:200;background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 14px;max-width:min(300px,calc(100vw - 24px));box-shadow:0 14px 34px -10px rgba(0,0,0,.5);animation:pop .18s}
.tip .s{font-family:var(--f-jp);font-size:26px;font-weight:800;line-height:1.3;display:flex;align-items:center;gap:10px}
.tip .r{font-family:var(--f-jp);font-weight:700;opacity:.8}
.tip .g{font-weight:800;font-size:16px;margin-top:4px}
.tip .n{font-size:13px;opacity:.85;margin-top:4px;font-weight:600}
.tip .say{background:color-mix(in srgb,var(--bg) 20%,transparent)}
.tip .say svg{stroke:var(--bg)}
@keyframes pop{from{transform:scale(.85);opacity:0}}

/* game tiles */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.gtile{border:0;cursor:pointer;text-align:left;border-radius:22px;padding:14px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;position:relative;min-height:150px}
.gtile .ic{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-jp);font-weight:800;font-size:22px;color:#fff}
.gtile b{font-size:16px;font-weight:900;line-height:1.2}
.gtile small{color:var(--muted);font-weight:700;font-size:13px;line-height:1.3}
.gtile .best{position:absolute;top:12px;right:12px;font-size:12px;font-weight:900;background:var(--bg2);border-radius:999px;padding:2px 8px}
.groups{display:flex;flex-wrap:wrap;gap:6px}
.gchip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-family:var(--f-jp);font-weight:800;cursor:pointer;font-size:15px}
.gchip.on{background:var(--c,var(--pink));border-color:var(--c,var(--pink));color:#fff}

/* kana grid */
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.kcell{border:0;cursor:pointer;background:var(--card);border-radius:16px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;box-shadow:0 4px 0 var(--line);position:relative}
.kcell b{font-family:var(--f-jp);font-size:30px;font-weight:700;line-height:1.15}
.kcell small{font-weight:800;color:var(--muted);font-size:12px;letter-spacing:.04em}
.kcell.empty{visibility:hidden}
.kcell .lv{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--line)}
.kcell .lv.l1{background:var(--orange)}.kcell .lv.l2{background:var(--yellow)}.kcell .lv.l3{background:var(--green)}
.kcell.yo b{font-size:24px}
.rowlabel{grid-column:1/-1;font-weight:900;color:var(--muted);font-size:13px;margin-top:8px}

/* kana detail */
.kdetail{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.kbig{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.kbig .glyph{font-family:var(--f-pen);font-weight:600;font-size:110px;line-height:1;width:150px;height:150px;display:grid;place-items:center;border-radius:28px;background:var(--bg2);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:50% 50%;background-position:center}
.kbig .rom{font-size:34px;font-weight:900;line-height:1}
.mnem{font-weight:700}
.strokebox{position:relative;width:min(300px,100%);aspect-ratio:1;max-width:100%;margin:0 auto;border-radius:24px;background:var(--card);touch-action:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:50% 50%;background-position:center;border:3px solid var(--line)}
.strokebox svg{position:absolute;inset:0;width:100%;height:100%}

/* ---------- game stage ---------- */
.stage{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;animation:slideup .3s cubic-bezier(.2,.9,.3,1)}
@keyframes slideup{from{transform:translateY(30px);opacity:0}}
.stage-top{display:flex;align-items:center;gap:10px;padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));max-width:780px;width:100%;margin:0 auto}
.prog{flex:1;height:14px;background:var(--bg2);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c,var(--green));border-radius:9px;transition:width .35s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.round-chips{display:flex;align-items:center;gap:4px;font-weight:900;font-variant-numeric:tabular-nums}
.round-chips svg{width:28px;height:28px}
.stage-body{flex:1;overflow-y:auto;width:100%;max-width:780px;margin:0 auto;padding-block:8px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.qtitle{font-weight:900;color:var(--muted);font-size:15px}
.prompt{background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--shadow);text-align:center}
.prompt .huge{font-family:var(--f-jp);font-size:84px;font-weight:700;line-height:1.1}
.prompt .pen{font-family:var(--f-pen);font-weight:600}
.prompt .sent{font-size:24px;line-height:2.15}
.prompt .ru{font-size:20px;font-weight:800}
.prompt .emoji{font-size:64px;line-height:1.1}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{border:0;cursor:pointer;background:var(--card);border-radius:20px;padding:14px 10px;font-weight:800;font-size:18px;box-shadow:0 5px 0 var(--line);border:2px solid var(--line);min-height:62px;line-height:1.5}
.opt.jpbig{font-family:var(--f-jp);font-size:34px;font-weight:700;line-height:1.2}
.opt.sent{font-size:19px;line-height:2}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.opt.ok{background:var(--ok-s);border-color:var(--ok);box-shadow:0 5px 0 var(--ok)}
.opt.bad{background:var(--bad-s);border-color:var(--bad);box-shadow:0 5px 0 var(--bad);animation:shake .35s}
.opt.dim{opacity:.5}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.tiles-line{min-height:70px;border-radius:20px;border:3px dashed var(--line);padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.tiles-bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:0;cursor:pointer;background:var(--card);border-radius:16px;padding:8px 14px;font-family:var(--f-jp);font-weight:700;font-size:22px;box-shadow:0 4px 0 var(--line);border:2px solid var(--line);line-height:1.9}
.tile.used{visibility:hidden}
.tile.pt{color:var(--pink)}
.fb{position:sticky;bottom:0;border-radius:24px 24px 0 0;padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));margin:0 -16px -20px;animation:slideup .25s}
.fb.ok{background:var(--ok-s)} .fb.bad{background:var(--bad-s)}
.fb h3{font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb .exp{margin:6px 0 12px;font-weight:700;line-height:1.6}
.fb .exp .jp{font-size:19px;line-height:2}
.endscreen{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding-top:20px}
.endscreen svg.mascot{width:140px}
.endscreen h2{font-size:30px;font-weight:900}
.stars{font-size:44px;letter-spacing:6px;color:var(--yellow);text-shadow:0 3px 0 var(--orange)}
.stars .off{color:var(--line);text-shadow:none}
.earn{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:900;background:var(--yellow-s);padding:8px 18px 8px 8px;border-radius:999px}
.earn svg{width:44px;height:44px}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mcard{aspect-ratio:3/4;border:0;border-radius:16px;cursor:pointer;perspective:600px;background:transparent;padding:0}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mcard.open .in,.mcard.done .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mcard .f{background:var(--c,var(--pink));box-shadow:0 4px 0 color-mix(in srgb,var(--c,var(--pink)) 70%,#000)}
.mcard .f svg{width:56%;opacity:.9}
.mcard .b{background:var(--card);transform:rotateY(180deg);font-family:var(--f-jp);font-weight:700;font-size:30px;border:3px solid var(--line);padding:4px;text-align:center;line-height:1.1}
.mcard .b.lat{font-family:var(--f-ru);font-weight:900;font-size:22px}
.mcard.done .b{border-color:var(--ok);background:var(--ok-s)}

/* bubbles */
.pond{position:relative;flex:1;min-height:360px;border-radius:24px;overflow:hidden;background:linear-gradient(var(--blue-s),var(--teal-s))}
.bub{position:absolute;width:74px;height:74px;border-radius:50%;border:0;cursor:pointer;font-family:var(--f-jp);font-weight:700;font-size:32px;color:var(--ink);
  background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95) 0 10%,transparent 11%),color-mix(in srgb,var(--c) 30%,var(--card));box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--c) 45%,transparent),0 6px 14px -8px rgba(0,0,0,.3)}
.bub.pop{animation:popb .3s forwards}
@keyframes popb{to{transform:scale(1.6);opacity:0}}
.bub.no{animation:shake .35s}

/* flashcard */
.flash{perspective:1000px;width:100%;max-width:360px;margin:0 auto;aspect-ratio:4/5;cursor:pointer;border:0;background:transparent;padding:0}
.flash .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.flash .f,.flash .b{position:absolute;inset:0;border-radius:30px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:18px}
.flash .b{transform:rotateY(180deg)}
.flash .f b{font-family:var(--f-pen);font-weight:600;font-size:130px;line-height:1}
.flash .hint{color:var(--muted);font-weight:800;font-size:13px}

/* scene (kore/sore/are) */
.scene{width:100%;max-width:520px;margin:0 auto;display:block;border-radius:22px;background:var(--green-s)}

/* clock */
.clock{width:220px;height:220px;margin:0 auto;display:block}

/* elevator */
.elev{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:260px;margin:0 auto;background:var(--bg2);padding:16px;border-radius:26px}
.fbtn{aspect-ratio:1;border-radius:50%;border:4px solid var(--line);background:var(--card);font-weight:900;font-size:24px;cursor:pointer;box-shadow:0 4px 0 var(--line);font-variant-numeric:tabular-nums}
.fbtn.ok{background:var(--ok-s);border-color:var(--ok)} .fbtn.bad{background:var(--bad-s);border-color:var(--bad)}

/* cafe */
.cafe-head{border-radius:24px;padding:14px;background:var(--orange-s);display:flex;align-items:center;gap:12px}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.mitem{border:0;cursor:pointer;background:var(--card);border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.mitem .e{font-size:38px;line-height:1.1}
.mitem .n{font-family:var(--f-jp);font-weight:800;font-size:17px;line-height:1.8}
.mitem .p{font-weight:900;color:var(--pink);font-variant-numeric:tabular-nums}
.mitem.sel{border-color:var(--green);background:var(--green-s)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:24px;flex:none;background:var(--card);box-shadow:var(--shadow)}
.msg .bubble{background:var(--card);border-radius:20px 20px 20px 6px;padding:8px 14px;box-shadow:var(--shadow);font-size:20px;line-height:2.05}
.msg .bubble .tr{font-family:var(--f-ru);font-size:13px;color:var(--muted);font-weight:700;line-height:1.3;display:block}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bubble{background:var(--pink-s);border-radius:20px 20px 6px 20px}

/* stickers */
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.stk{border:0;background:var(--card);border-radius:22px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow);cursor:pointer}
.stk .e{font-size:46px;line-height:1.1;width:72px;height:72px;display:grid;place-items:center;border-radius:50%;background:var(--bg2);border:4px solid #fff}
.stk.locked .e{filter:grayscale(1) opacity(.45)}
.stk b{font-family:var(--f-jp);font-size:16px;line-height:1.8}
.stk small{font-weight:900;font-size:13px;display:flex;align-items:center;gap:3px}
.stk small svg{width:22px;height:22px}

/* modal */
.modal{position:fixed;inset:0;z-index:150;background:rgba(40,10,40,.45);display:grid;place-items:center;padding:16px}
.modal .card{max-width:440px;width:100%;max-height:88vh;overflow-y:auto}
.modal h2{font-size:22px;font-weight:900;margin-bottom:8px}
.modal ol{padding-left:22px;margin:8px 0;font-weight:700}
.modal li{margin:6px 0}

/* chip fly */
.flychip{position:fixed;z-index:300;width:36px;height:36px;pointer-events:none;transition:transform .7s cubic-bezier(.5,-0.3,.6,1),opacity .7s}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:250;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;animation:pop .2s;max-width:calc(100vw - 32px);text-align:center}

@media (max-width:420px){
  .prompt .huge{font-size:72px}
  .opt.jpbig{font-size:30px}
  .kgrid{gap:6px}.kcell b{font-size:26px}
  .band h1{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

    const g = this.cur;
    g.locked = true;

    else {
      Snd.bad();
      if (!q.retry && q.type !== 'custom' && !g.retried.has(g.i)) { g.retried.add(g.i); g.queue.push(Object.assign({}, q, { retry: true })); }
    }
    if (q.kana) kanaStat(q.kana, ok);
    if (q.onAnswer) q.onAnswer(ok);
    const explain = exp || q.explain || '';
    const pr = pick(PRAISE);
    const fb = document.createElement('div'); fb.className = 'fb ' + (ok ? 'ok' : 'bad');
    let right = '';
    if (!ok && q.type === 'order') right = `<div class="exp">Правильно: <span class="jp">${J(q.answers[0].join(' '))}</span></div>`;
    fb.innerHTML = `<h3>${ok ? '✓ ' + pr + (PRAISE_JP[pr] ? ` <span class="small muted" style="font-weight:800">${PRAISE_JP[pr]}</span>` : '') : '✗ ' + pick(CHEER)}</h3>
      ${right}${explain ? `<div class="exp">${explain}</div>` : ''}${!ok && !q.retry && q.type !== 'custom' ? '<div class="small muted" style="margin:-6px 0 10px;font-weight:700">Этот вопрос вернётся в конце раунда.</div>' : ''}
      <button class="btn wide" style="--c:${ok ? 'var(--ok)' : 'var(--bad)'}" data-next>Дальше</button>`;
    g.body.appendChild(fb);
    setTimeout(() => fb.scrollIntoView({ block: 'end', behavior: 'smooth' }), 30);
    $('[data-next]', fb).onclick = () => { g.locked = false; g.i++; this.next(); };
    if (q.sayAfter) Voice.say(q.sayAfter);
  },
  end(o = {}) {
    const g = this.cur; if (g.done) return; g.done = true;
    if (g.cleanup) g.cleanup();
    $('.prog i', g.el).style.width = '100%';
    const total = o.total != null ? o.total : g.first, ok = o.ok != null ? o.ok : g.ok;
    const ratio = total ? Math.min(1, (o.firstOk != null ? o.firstOk : Math.min(ok, total)) / total) : 1;
    const correctFirst = o.ratio != null ? o.ratio : (g.cfg.custom ? ratio : (g.total ? (g.total - g.retried.size) / g.total : 1));
    const stars = correctFirst >= .9 ? 3 : correctFirst >= .7 ? 2 : correctFirst >= .4 ? 1 : 0;
    let bonus = stars === 3 ? 5 : stars === 2 ? 2 : 0;
    if (bonus) addChips(bonus);
    const id = g.cfg.id; const rec = S().games[id] || { best: 0, plays: 0 };
    rec.plays++; rec.best = Math.max(rec.best, stars); S().games[id] = rec; Store.save();
    const msg = stars === 3 ? ['すばらしい！', 'Великолепно!'] : stars === 2 ? ['よくできました！', 'Хорошо получилось!'] : stars === 1 ? ['がんばって！', 'Продолжаем стараться!'] : ['だいじょうぶ！', 'Всё получится, попробуй ещё!'];
    Snd.win();
    g.body.innerHTML = `<div class="endscreen">${mascotSVG(stars >= 2 ? 'loud' : 'happy')}
      <h2>${J(msg[0])}</h2><div class="muted" style="font-weight:800;margin-top:-8px">${msg[1]}</div>
      <div class="stars">${[0, 1, 2].map(i => `<span class="${i < stars ? '' : 'off'}">★</span>`).join('')}</div>
      ${o.text ? `<div style="font-weight:800">${o.text}</div>` : `<div style="font-weight:800">С первого раза: ${Math.round(correctFirst * 100)}%</div>`}
      <div class="earn">${chipSVG()}+${g.chips + bonus} чипси</div>
      <div class="row" style="justify-content:center;margin-top:8px"><button class="btn" data-again style="--c:var(--c)">Ещё раунд</button><button class="btn ghost" data-out>К разделу</button></div>
      <div class="small muted" style="font-weight:700">В новом раунде будут другие примеры</div></div>`;
    $('[data-again]', g.body).onclick = () => { const cfg = g.cfg; g.el.remove(); this.cur = null; this.start(cfg); };
    $('[data-out]', g.body).onclick = () => this.exit();
  },
};

/* ---------- kana mastery (Leitner-like) ---------- */
function kanaStat(k, ok) {
  const d = S().kana[k] || { c: 0, w: 0, b: 0 };
  if (ok) { d.c++; d.b = Math.min(3, d.b + (d.lastOk ? 1 : 0) + (d.b === 0 ? 1 : 0)); d.lastOk = true; }
  else { d.w++; d.b = Math.max(0, d.b - 1); d.lastOk = false; }
  S().kana[k] = d; Store.save();
}
function kanaLevel(k) { const d = S().kana[k]; return d ? d.b : -1; }
// weighted sampling: weaker kana appear more often
function weightedPick(items, keyFn, n) {
  const pool = items.map(it => { const lv = kanaLevel(keyFn(it)); return { it, w: lv < 0 ? 3 : 4 - lv }; });
  const out = [];
  while (out.length < n && pool.length) {
    const sum = pool.reduce((a, b) => a + b.w, 0); let r = Math.random() * sum, k = 0;
    while (r > pool[k].w) { r -= pool[k].w; k++; }
    out.push(pool[k].it); pool.splice(k, 1);
  }
  return out;
}

const NUM_KANJI = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
const DIG_R = ['', 'いち', 'に', 'さん', 'よん', 'ご', 'ろく', 'なな', 'はち', 'きゅう'];
function readNum(n) { // 0..99999999
  if (n === 0) return 'ゼロ';
  let s = '';
  const man = Math.floor(n / 10000); n %= 10000;
  if (man) s += (man === 1 ? 'いち' : readNum(man)) + 'まん';
  const sen = Math.floor(n / 1000); n %= 1000;
  if (sen) s += sen === 1 ? 'せん' : sen === 3 ? 'さんぜん' : sen === 8 ? 'はっせん' : DIG_R[sen] + 'せん';
  const hyaku = Math.floor(n / 100); n %= 100;
  if (hyaku) s += hyaku === 1 ? 'ひゃく' : hyaku === 3 ? 'さんびゃく' : hyaku === 6 ? 'ろっぴゃく' : hyaku === 8 ? 'はっぴゃく' : DIG_R[hyaku] + 'ひゃく';
  const ju = Math.floor(n / 10); n %= 10;
  if (ju) s += (ju === 1 ? '' : DIG_R[ju]) + 'じゅう';
  if (n) s += DIG_R[n];
  return s;
}

function kanjiNum(n) {

  const ju = Math.floor(n / 10); n %= 10; if (ju) s += (ju === 1 ? '' : NUM_KANJI[ju]) + '十';

/* ---- stroke order animation ---- */
function strokeView(box, ch, opt = {}) {
  const paths = STROKES[ch];

  const svg = document.createElementNS(SVGNS, 'svg'); svg.setAttribute('viewBox', '0 0 109 109'); wrap.appendChild(svg);

  const ghost = paths.map(d => { const p = document.createElementNS(SVGNS, 'path'); p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', 'var(--line)'); p.setAttribute('stroke-width', '5'); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round'); svg.appendChild(p); return p; });
  const live = paths.map(d => { const p = document.createElementNS(SVGNS, 'path'); p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', col); p.setAttribute('stroke-width', '5.5'); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round'); svg.appendChild(p); return p; });

  let timer = [];

  const play = () => {

/* ---- tracing with stroke check ---- */
function resample(pts, n) {
  if (pts.length < 2) return Array(n).fill(pts[0] || { x: 0, y: 0 });
  const d = [0]; for (let i = 1; i < pts.length; i++) d.push(d[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  const L = d[d.length - 1] || 1, out = []; let j = 0;
  for (let k = 0; k < n; k++) {
    const t = L * k / (n - 1); while (j < d.length - 2 && d[j + 1] < t) j++;
    const seg = (d[j + 1] - d[j]) || 1, u = (t - d[j]) / seg;
    out.push({ x: pts[j].x + (pts[j + 1].x - pts[j].x) * u, y: pts[j].y + (pts[j + 1].y - pts[j].y) * u });
  }
  return out;
}
function traceView(box, ch, onDone, opt = {}) {
  const paths = STROKES[ch]; box.innerHTML = '';
  if (!paths) { onDone && onDone(true); return; }
  const wrap = document.createElement('div'); wrap.className = 'strokebox'; box.appendChild(wrap);
  const msg = document.createElement('div'); msg.className = 'small'; msg.style.cssText = 'text-align:center;font-weight:800;min-height:24px;margin-top:8px'; box.appendChild(msg);
  const svg = document.createElementNS(SVGNS, 'svg'); svg.setAttribute('viewBox', '0 0 109 109'); wrap.appendChild(svg);
  const mk = (d, stroke, w, dash) => { const p = document.createElementNS(SVGNS, 'path'); p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', stroke); p.setAttribute('stroke-width', w); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round'); if (dash) p.setAttribute('stroke-dasharray', dash); svg.appendChild(p); return p; };
  const ghosts = paths.map(d => mk(d, 'var(--line)', 7));
  const doneLayer = document.createElementNS(SVGNS, 'g'); svg.appendChild(doneLayer);
  const target = paths.map(p => { const el = ghosts[paths.indexOf(p)]; const L = el.getTotalLength(); return Array.from({ length: 16 }, (_, k) => { const q = el.getPointAtLength(L * k / 15); return { x: q.x, y: q.y }; }); });
  const lens = ghosts.map(g => g.getTotalLength());
  let cur = 0, mistakes = 0, guide = null, startDot = null;
  const showGuide = () => {
    if (guide) guide.remove(); if (startDot) startDot.remove();
    if (cur >= paths.length) return;
    guide = mk(paths[cur], 'var(--pink)', 3, '2 5'); guide.style.opacity = opt.hard ? 0 : .9;
    const s = target[cur][0], s2 = target[cur][2];
    startDot = document.createElementNS(SVGNS, 'g');
    const ang = Math.atan2(s2.y - s.y, s2.x - s.x) * 180 / Math.PI;
    startDot.innerHTML = `<circle cx="${s.x}" cy="${s.y}" r="5" fill="var(--green)"/><path d="M-2.5 -3 L2.5 0 L-2.5 3" transform="translate(${s.x},${s.y}) rotate(${ang})" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
    svg.appendChild(startDot);
    msg.innerHTML = `Черта ${cur + 1} из ${paths.length}: начни от <span style="color:var(--green)">зелёной точки</span>`;
  };
  showGuide();
  let drawing = null, pts = [];
  const toSvg = e => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const m = svg.getScreenCTM().inverse(); const r = pt.matrixTransform(m); return { x: r.x, y: r.y }; };
  wrap.addEventListener('pointerdown', e => {
    if (cur >= paths.length) return; e.preventDefault(); wrap.setPointerCapture(e.pointerId);
    pts = [toSvg(e)]; drawing = mk('', 'var(--ink)', 6);
  });
  wrap.addEventListener('pointermove', e => {
    if (!drawing) return; const p = toSvg(e); const l = pts[pts.length - 1];
    if (Math.hypot(p.x - l.x, p.y - l.y) < .8) return; pts.push(p);
    drawing.setAttribute('d', 'M' + pts.map(q => q.x.toFixed(1) + ' ' + q.y.toFixed(1)).join(' L'));
  });
  const up = () => {
    if (!drawing) return; const dr = drawing; drawing = null;
    const T = target[cur], U = resample(pts, 16), L = lens[cur];
    const ulen = pts.reduce((a, p, i) => i ? a + Math.hypot(p.x - pts[i - 1].x, p.y - pts[i - 1].y) : 0, 0);
    const tol = L < 15 ? 16 : 20;
    const ds = Math.hypot(U[0].x - T[0].x, U[0].y - T[0].y), de = Math.hypot(U[15].x - T[15].x, U[15].y - T[15].y);
    const mean = U.reduce((a, p, k) => a + Math.hypot(p.x - T[k].x, p.y - T[k].y), 0) / 16;
    const rev = Math.hypot(U[0].x - T[15].x, U[0].y - T[15].y) < tol && Math.hypot(U[15].x - T[0].x, U[15].y - T[0].y) < tol;
    const ok = (ds < tol && de < tol + 4 && mean < tol - 3) || (L < 15 && ds < 16 && ulen < 40);
    dr.remove();
    if (ok) {
      const fin = mk(paths[cur], 'var(--ink)', 6); doneLayer.appendChild(fin);
      Snd.pop(); cur++;
      if (cur >= paths.length) { if (guide) guide.remove(); if (startDot) startDot.remove(); msg.innerHTML = '<span style="color:var(--ok)">Готово! Все черты в правильном порядке ✓</span>'; onDone && onDone(mistakes === 0, mistakes); }
      else showGuide();
    } else {
      mistakes++; Snd.bad(); wrap.style.animation = 'shake .35s'; setTimeout(() => wrap.style.animation = '', 360);
      msg.innerHTML = rev ? '<span style="color:var(--bad)">Наоборот! Эту черту пишут в другую сторону — от зелёной точки.</span>'
        : ds >= tol ? '<span style="color:var(--bad)">Начни от зелёной точки — это начало черты.</span>'
          : '<span style="color:var(--bad)">Чуть мимо — веди по пунктиру. Попробуй ещё!</span>';

}

function twinsQs(script) {

/* ---- flashcards ---- */
function flashGame(script) {
  const ks = kanaSet(script);
  Game.start({
    id: (script === 'h' ? 'hira' : 'kata') + '-flash', color: ks.color, custom: (body, api) => {
      const p = kanaPool(script); const cards = weightedPick(p, k => k, Math.min(12, p.length)); let i = 0, know = 0;
      const show = () => {
        if (i >= cards.length) return api.end({ ok: know, total: cards.length, ratio: know / cards.length, text: `Знаю: ${know} из ${cards.length}` });
        api.progress(i / cards.length);
        const k = cards[i], info = KANA[k];
        body.innerHTML = `<div class="qtitle">Вспомни, как читается знак, и переверни карточку</div>
          <button class="flash" data-card><div class="in"><div class="f"><b>${k}</b><span class="hint">нажми, чтобы перевернуть</span></div>
          <div class="b"><div style="font-size:54px;font-weight:900;line-height:1">${info.r}</div><div class="jp" style="font-size:40px">${k}</div>
          ${info.m ? `<div class="small" style="font-weight:700;text-align:center">${esc(info.m)}</div>` : ''}${info.w ? `<div class="jp" style="font-size:20px;font-weight:700">${esc(info.w)} <span class="small muted" style="font-family:var(--f-ru)">— ${esc(info.t)}</span></div>` : ''}</div></div></button>
          <div class="row" data-rate hidden style="justify-content:center"><button class="btn" style="--c:var(--orange)" data-r="0">Ещё учу</button><button class="btn" style="--c:var(--green)" data-r="1">Знаю!</button></div>`;
        const card = $('[data-card]', body);
        card.onclick = () => { if (card.classList.contains('flip')) return; card.classList.add('flip'); Voice.say(k); $('[data-rate]', body).hidden = false; };
        $$('[data-r]', body).forEach(b => b.onclick = () => { const ok = b.dataset.r === '1'; kanaStat(k, ok); if (ok) { know++; api.correct(b); } else api.wrong(); i++; show(); });

}

/* ---- memory pairs ---- */
function memoryGame(script) {
  const ks = kanaSet(script);
  Game.start({
    id: (script === 'h' ? 'hira' : 'kata') + '-memory', color: 'var(--grape)', custom: (body, api) => {
      const p = kanaPool(script); const ks6 = sample(p, Math.min(6, p.length));
      // avoid duplicate romaji (e.g. お/を)
      const used = new Set(); const sel = ks6.filter(k => { if (used.has(KANA[k].r)) return false; used.add(KANA[k].r); return true; });
      const cards = shuffle([].concat(...sel.map(k => [{ k, t: k, lat: false }, { k, t: KANA[k].r, lat: true }])));
      let open = [], pairs = 0, moves = 0, lock = false;
      body.innerHTML = `<div class="qtitle">Открывай по две карточки: знак + его звук</div><div class="mem">${cards.map((c, i) => `<button class="mcard" data-i="${i}" style="--c:${i % 2 ? 'var(--grape)' : 'var(--pink)'}"><div class="in"><div class="f">${chipSVG(false)}</div><div class="b ${c.lat ? 'lat' : ''}">${esc(c.t)}</div></div></button>`).join('')}</div>
        <div class="small muted" style="text-align:center;font-weight:800" data-mv>Ходов: 0</div>`;
      $$('.mcard', body).forEach(b => b.onclick = () => {
        const c = cards[+b.dataset.i]; if (lock || b.classList.contains('open') || b.classList.contains('done')) return;
        b.classList.add('open'); if (!c.lat) Voice.say(c.k); open.push(b);
        if (open.length === 2) {
          moves++; $('[data-mv]', body).textContent = 'Ходов: ' + moves;
          const [a, d] = open.map(x => cards[+x.dataset.i]);
          if (a.k === d.k && a.lat !== d.lat) { open.forEach(x => { x.classList.remove('open'); x.classList.add('done'); }); open = []; pairs++; kanaStat(a.k, true); api.correct(b); Snd.ok(); api.progress(pairs / sel.length); if (pairs === sel.length) setTimeout(() => api.end({ ok: pairs, total: sel.length, ratio: Math.min(1, sel.length * 1.6 / moves), text: `Все пары за ${moves} ходов` }), 700); }
          else { lock = true; setTimeout(() => { open.forEach(x => x.classList.remove('open')); open = []; lock = false; }, 900); }
        }
      });
    }
  });
}

/* ---- bubbles ---- */
function bubbleGame(script) {
  Game.start({
    id: (script === 'h' ? 'hira' : 'kata') + '-bubbles', color: 'var(--blue)', custom: (body, api) => {
      const p = kanaPool(script).filter(k => k.length === 1);
      let score = 0, miss = 0, rounds = 0, target = null, time = 60, alive = true;
      body.innerHTML = `<div class="row" style="justify-content:space-between"><div class="qtitle">Лопни пузырик со звуком:</div><b style="font-variant-numeric:tabular-nums" data-t>60 с</b></div>
        <div class="prompt" style="padding:10px"><span style="font-size:40px;font-weight:900" data-target></span> ${sayBtn('', 'Звук')}</div><div class="pond" data-pond></div>`;
      const pond = $('[data-pond]', body), tg = $('[data-target]', body), sb = $('.say', body);
      const cols = ['var(--pink)', 'var(--orange)', 'var(--green)', 'var(--grape)', 'var(--yellow)', 'var(--teal)'];
      const newTarget = () => { target = pick(p); tg.textContent = KANA[target].r; sb.dataset.say = target; Voice.say(target); };
      const spawn = () => {
        if (!alive) return;
        const k = Math.random() < .38 ? target : pick(kanaDistractors(target, p, script, 4).concat(p));
        const b = document.createElement('button'); b.className = 'bub'; b.textContent = k; b.style.setProperty('--c', pick(cols));
        const W = pond.clientWidth - 80; b.style.left = (8 + Math.random() * W) + 'px'; b.style.top = pond.clientHeight + 'px';
        pond.appendChild(b);
        const dur = 5200 + Math.random() * 2500, t0 = performance.now(), sway = Math.random() * 30 + 10, ph = Math.random() * 6;
        const step = t => { if (!b.isConnected) return; const u = (t - t0) / dur; if (u >= 1) { b.remove(); return; } b.style.transform = `translate(${Math.sin(u * 7 + ph) * sway}px,${-u * (pond.clientHeight + 90)}px)`; requestAnimationFrame(step); };
        requestAnimationFrame(step);
        b.onclick = () => {
          if (!alive) return;
          if (k === target) { score++; b.classList.add('pop'); Snd.pop(); kanaStat(k, true); api.correct(b); setTimeout(() => b.remove(), 300); rounds++; newTarget(); }
          else { miss++; b.classList.add('no'); Snd.bad(); kanaStat(k, false); toast(`${k} — это «${KANA[k].r}»`, 1200); }
        };
      };
      newTarget();
      const sp = setInterval(spawn, 650); for (let i = 0; i < 4; i++) setTimeout(spawn, i * 200);
      const tm = setInterval(() => { time--; $('[data-t]', body).textContent = time + ' с'; api.progress(1 - time / 60); if (time <= 0) finish(); }, 1000);
      const finish = () => { if (!alive) return; alive = false; clearInterval(sp); clearInterval(tm); api.end({ ok: score, total: score + miss, ratio: Math.min(1, score / 14) * (score + miss ? score / (score + miss) : 0) * 1.1, text: `Лопнуто: ${score} · промахов: ${miss}` }); };
      Game.cur.cleanup = () => { alive = false; clearInterval(sp); clearInterval(tm); };
    }
  });
}

      <div class="path">${UNITS.map((u, i) => { const p = unitProgress(u); return `<a class="station" href="#${u.id}"><span class="jp-badge" style="background:${u.color}">${u.badge}</span><div style="min-width:0"><div class="step-n">ШАГ ${i + 1} · ${esc(u.jp)}</div><h3>${u.title}</h3><p>${u.desc}</p><div class="bar" style="--c:${u.color}"><i style="width:${p}%"></i></div></div><span class="step-n">${p}%</span></a>`; }).join('')}</div>
      ${Install.standalone() ? '' : `<button class="btn wide" style="--c:var(--pink)" onclick="Install.open()">${ICON.phone.replace('<svg', '<svg style="width:22px;height:22px"')} Установить на телефон</button>`}
      <p class="small muted" style="text-align:center;font-weight:700">Порядок шагов — как на уроках: сначала хирагана и первые фразы, потом は и の, катакана с числами, кафе, а в конце время и глаголы.</p>
    </div>`;
    $('#warmup').onclick = warmup;
  },
  unitPage(m, u) {
    const tabs = (u.kana ? [['abc', 'Азбука']] : []).concat([['lesson', 'Урок'], ['games', 'Игры']]);
    const cur = this.tab[u.id] || (u.kana ? 'abc' : (S().lessons[u.id] ? 'games' : 'lesson'));
    const p = unitProgress(u);
    m.innerHTML = `<div class="stack"><div class="band" style="background:${u.color}"><span class="big">${u.badge}</span><div class="step-n" style="color:rgba(255,255,255,.85)">${esc(u.jp)} · пройдено ${p}%</div><h1>${u.title}</h1><p>${u.desc}</p></div>
      <div class="tabs" role="tablist">${tabs.map(t => `<button role="tab" class="${t[0] === cur ? 'on' : ''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div><div id="tabBody"></div></div>`;
    $$('[data-t]', m).forEach(b => b.onclick = () => { this.tab[u.id] = b.dataset.t; this.unitPage(m, u); });
    const body = $('#tabBody');
    if (cur === 'abc') kanaGrid(body, u.kana);
    else if (cur === 'lesson') {
      u.lesson(body);
      const done = S().lessons[u.id];
      const f = document.createElement('div'); f.style.marginTop = '14px';
      f.innerHTML = done ? `<button class="btn wide" style="--c:${u.color}" data-go>Урок пройден ✓ — к играм</button>` : `<button class="btn wide" style="--c:${u.color}" data-go>Я прочитала урок! +5 чипси</button>`;
      body.appendChild(f);
      $('[data-go]', f).onclick = (e) => { if (!S().lessons[u.id]) { S().lessons[u.id] = true; Store.save(); addChips(5, e.currentTarget); } this.tab[u.id] = 'games'; setTimeout(() => { this.unitPage(m, u); window.scrollTo(0, 0); }, 300); };
    } else {
      const wrap = document.createElement('div'); wrap.className = 'stack'; body.appendChild(wrap);
      if (u.kana) { const gp = document.createElement('div'); wrap.appendChild(gp); groupPicker(gp, u.kana); }
      const grid = document.createElement('div'); grid.className = 'games'; wrap.appendChild(grid);
      const gs = u.games();
      grid.innerHTML = gs.map((g, i) => { const b = (S().games[g.id] || {}).best; return `<button class="gtile" data-g="${i}">${b != null ? `<span class="best">${'★'.repeat(b)}${'☆'.repeat(3 - b)}</span>` : ''}<span class="ic" style="background:${g.color}">${g.icon}</span><b>${g.title}</b><small>${g.desc}</small></button>`; }).join('');
      $$('[data-g]', grid).forEach(b => b.onclick = () => gs[+b.dataset.g].start());
      if (!Voice.v && Voice.ready) { const n = document.createElement('div'); n.className = 'note blue'; n.innerHTML = 'На этом устройстве не нашёлся японский голос, поэтому игры «на слух» могут молчать. На телефоне его можно добавить в настройках: «Язык и ввод → Синтез речи» (Android) или «Универсальный доступ → Устный контент → Голоса» (iPhone).'; wrap.appendChild(n); }
    }
  },
  progressPage(m) {
    const cellRow = (list) => list.map(k => { const l = kanaLevel(k); const bg = l < 0 ? 'var(--bg2)' : l <= 1 ? 'var(--orange-s)' : l === 2 ? 'var(--yellow-s)' : 'var(--green-s)'; return `<span class="jp" title="${KANA[k].r}" style="display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:${bg};font-weight:700;font-size:18px">${k}</span>`; }).join('');
    const own = new Set(S().stickers);
    m.innerHTML = `<div class="stack"><div class="band" style="background:var(--yellow);color:#3A2240"><span class="big">★</span><h1>Мои успехи</h1><p>Всего заработано: ${S().earned} чипси · дней подряд: ${S().streak.n}</p></div>
      <div class="card stack"><h2 style="font-size:20px">Хирагана</h2><div class="row" style="gap:4px">${cellRow(HIRA_BASIC.map(x => x[0]))}</div>
      <h2 style="font-size:20px">Катакана</h2><div class="row" style="gap:4px">${cellRow(KATA_BASIC.map(x => x[0]))}</div>
      <div class="small muted" style="font-weight:700">Серый — ещё не встречался, оранжевый — учу, жёлтый — почти, зелёный — знаю.</div></div>
      <div class="card stack"><h2 style="font-size:20px">Разделы</h2>${UNITS.map(u => `<div><div class="row" style="justify-content:space-between"><b>${u.title}</b><span class="step-n">${unitProgress(u)}%</span></div><div class="bar" style="--c:${u.color}"><i style="width:${unitProgress(u)}%"></i></div></div>`).join('')}</div>
      <div class="card stack"><h2 style="font-size:20px">Мои наклейки</h2>${own.size ? `<div class="stickers">${STICKERS.filter(s => own.has(s[0])).map(s => `<div class="stk"><span class="e">${s[0]}</span><b>${J(s[1])}</b><small class="muted">${s[2]}</small></div>`).join('')}</div>` : '<p class="muted" style="font-weight:700">Пока пусто. Загляни в <a href="#shop">лавку наклеек</a>!</p>'}</div></div>`;
  },
  shopPage(m) {
    const own = new Set(S().stickers);
    m.innerHTML = `<div class="stack"><div class="band" style="background:var(--green)"><span class="big">店</span><h1>Лавка наклеек</h1><p>Обменивай чипси на наклейки. Каждая наклейка — новое японское слово: нажми на него!</p></div>
      <div class="card row" style="justify-content:space-between"><b>У тебя:</b><span class="earn" style="font-size:20px">${chipSVG()}${S().chips} чипси</span></div>
      <div class="stickers">${STICKERS.map((s, i) => `<div class="stk ${own.has(s[0]) ? '' : 'locked'}"><span class="e">${s[0]}</span><b>${J(s[1])}</b><small class="muted">${s[2]}</small>
        ${own.has(s[0]) ? '<small style="color:var(--ok)">✓ твоя</small>' : `<button class="btn sm" style="--c:${S().chips >= s[3] ? 'var(--orange)' : 'var(--muted)'}" data-buy="${i}">${s[3]} чипси</button>`}</div>`).join('')}</div></div>`;
    $$('[data-buy]', m).forEach(b => b.onclick = () => {
      const s = STICKERS[+b.dataset.buy];
      if (S().chips < s[3]) { toast(`Нужно ещё ${s[3] - S().chips} чипси — поиграй немножко!`); Snd.bad(); return; }
      S().chips -= s[3]; S().stickers.push(s[0]); Store.save(); renderChips(); Snd.win(); Voice.say(R(s[1]));
      toast(`Наклейка «${s[2]}» теперь твоя!`); this.shopPage(m);
    });
  },
  settingsPage(m) {
    const st = S().settings;
    const theme = (() => { try { return localStorage.getItem('urusai.theme') || 'system'; } catch (e) { return 'system'; } })();
    m.innerHTML = `<div class="stack"><div class="band" style="background:var(--ink);color:var(--bg)"><span class="big">⚙</span><h1>Настройки</h1><p>Звук, оформление и резервная копия прогресса</p></div>
      <div class="card stack">
        <label class="row" style="justify-content:space-between"><b>Звуки кнопок («поньк»)</b><input type="checkbox" id="setSound" ${st.sound ? 'checked' : ''} style="width:24px;height:24px"></label>
        <label class="row" style="justify-content:space-between"><b>Японская озвучка слов</b><input type="checkbox" id="setVoice" ${st.voice ? 'checked' : ''} style="width:24px;height:24px"></label>
        <div class="row"><button class="btn sm ghost" id="testVoice">${ICON.say.replace('<svg', '<svg style="width:18px;height:18px"')} Проверить голос</button><span class="small muted" style="font-weight:700">${Voice.v ? 'Голос: ' + esc(Voice.v.name) : 'Японский голос не найден — попробуй всё равно'}</span></div>
        <div><b>Тема</b><div class="tabs" style="margin-top:6px">${[['system', 'Как в телефоне'], ['light', 'Светлая'], ['dark', 'Тёмная']].map(t => `<button class="${theme === t[0] ? 'on' : ''}" data-theme="${t[0]}">${t[1]}</button>`).join('')}</div></div>
      </div>
      <div class="card stack"><h2 style="font-size:20px">Резервная копия</h2>
        <p class="small" style="font-weight:700;margin:0">Прогресс хранится на этом телефоне. Чтобы перенести его на другое устройство (или подстраховаться), скопируй код и сохрани, например, в заметках.</p>
        <textarea id="bk" rows="3" style="width:100%;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;font:12px monospace" aria-label="Код прогресса"></textarea>
        <div class="row"><button class="btn sm" id="bkCopy" style="--c:var(--blue)">Скопировать мой код</button><button class="btn sm ghost" id="bkLoad">Загрузить код из поля</button></div></div>
      <div class="card stack"><h2 style="font-size:20px">Начать заново</h2><div id="resetBox"><button class="btn sm ghost" id="reset">Стереть весь прогресс</button></div></div>
      <p class="small muted" style="text-align:center;font-weight:700">Данные о порядке черт — KanjiVG (CC BY-SA 3.0, Ulrich Apel).</p></div>`;
    $('#setSound').onchange = e => { st.sound = e.target.checked; Store.save(); };
    $('#setVoice').onchange = e => { st.voice = e.target.checked; Store.save(); };
    $('#testVoice').onclick = () => Voice.say('こんにちは。うるさいへ ようこそ！');
    $$('[data-theme]', m).forEach(b => b.onclick = () => { try { localStorage.setItem('urusai.theme', b.dataset.theme); } catch (e) { } this.applyTheme(); this.settingsPage(m); });
    const bk = $('#bk'); bk.value = btoa(unescape(encodeURIComponent(JSON.stringify(S()))));
    $('#bkCopy').onclick = () => { bk.select(); (navigator.clipboard ? navigator.clipboard.writeText(bk.value) : Promise.reject()).then(() => toast('Код скопирован'), () => { bk.select(); toast('Выдели текст и скопируй вручную'); }); };
    $('#bkLoad').onclick = () => { try { const d = JSON.parse(decodeURIComponent(escape(atob(bk.value.trim())))); if (typeof d.chips !== 'number') throw 0; Store.d = Object.assign(DEF(), d); Store.save(); renderChips(); toast('Прогресс загружен!'); this.settingsPage(m); } catch (e) { toast('Код не подошёл — проверь, что скопирован целиком'); } };
    $('#reset').onclick = () => { $('#resetBox').innerHTML = `<p style="font-weight:800;margin:0 0 8px">Точно стереть все чипси, звёзды и наклейки?</p><div class="row"><button class="btn sm" style="--c:var(--bad)" id="resetYes">Да, стереть</button><button class="btn sm ghost" id="resetNo">Нет, оставить</button></div>`; $('#resetNo').onclick = () => this.settingsPage(m); $('#resetYes').onclick = () => { Store.d = DEF(); Store.save(); renderChips(); toast('Всё начинается заново!'); this.settingsPage(m); }; };
  },
  applyTheme() {
    let t = 'system'; try { t = localStorage.getItem('urusai.theme') || 'system'; } catch (e) { }
    if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  },
};
function yesterdayStr() { const y = new Date(); y.setDate(y.getDate() - 1); return y.getFullYear() + '-' + (y.getMonth() + 1) + '-' + y.getDate(); }
function touchDayView() { const d = S(); if (d.day.d !== todayStr()) { d.day = { d: todayStr(), n: 0 }; Store.save(); } }

/* warm-up: mix of everything the learner has opened */
function warmup() {
  const opened = UNITS.filter(u => unitProgress(u) > 0 || u.id === 'hira');
  const gens = [];
  opened.forEach(u => {
    if (u.id === 'hira' || u.id === 'kata') { const sc = u.kana; gens.push(() => { const p = kanaPool(sc); return qSound(pick(p), p, sc); }, () => { const p = kanaPool(sc); return qFind(pick(p), p, sc); }); }
    if (u.id === 'aisatsu') gens.push(() => { const p = pick(PHR); const c = mkChoice(P(p[0]), sample(PHR.filter(x => x !== p), 3).map(x => P(x[0]))); return { type: 'choice', title: 'Что ты скажешь?', prompt: `<div class="ru">${pick(p[2])}</div>`, options: c.options, answer: c.answer, cls: 'one', optCls: 'sent', explain: `${J(p[0])} — ${p[1]}` }; });
    if (u.id === 'wa') gens.push(qWaParticle, qWaTranslate, qWaTrue);
    if (u.id === 'no') gens.push(qNoWho, qNoTranslate);
    if (u.id === 'koso') gens.push(() => qKosoWhere(false), qKoreKono);
    if (u.id === 'num') gens.push(() => qNumRead(rnd(3)), qKanjiNum, qTrap);
    if (u.id === 'age') gens.push(qAgeRead, qFloorRead);
    if (u.id === 'cafe') gens.push(qMenuWord, qCashier);
    if (u.id === 'time') gens.push(qClock, qMinutes);
    if (u.id === 'verbs') gens.push(qVerbForm, qNi);
  });
  Game.start({ id: 'warmup', color: 'var(--grape)', make: () => Array.from({ length: 10 }, () => pick(gens)()) });
}

/* ---------- install (PWA) ---------- */
const Install = {
  ev: null,
  standalone() { return window.matchMedia && matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; },
  open() {
    if (this.standalone()) { modal(`<h2>Уже установлено ✓</h2><p style="font-weight:700">${J('うるさい')} открыто как приложение. Прогресс хранится на этом телефоне.</p><button class="btn wide" data-close>Отлично</button>`); return; }
    if (this.ev) { this.ev.prompt(); this.ev.userChoice.then(r => { if (r.outcome === 'accepted') toast('Готово! Ищи うるさい на главном экране'); this.ev = null; }); return; }
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const framed = (() => { try { return window.top !== window.self; } catch (e) { return true; } })();
    modal(`<h2>Установить на телефон</h2>
      ${framed ? '<div class="note pink" style="margin-bottom:10px">Сейчас приложение открыто внутри другой страницы. Чтобы установить его, открой прямую ссылку на うるさい в браузере телефона.</div>' : ''}
      <p style="font-weight:700;margin:0">Иконка появится на главном экране, приложение будет открываться без браузера, а прогресс сохранится на телефоне.</p>
      <h3 style="margin-top:12px">${ios ? 'iPhone / iPad (Safari)' : 'Android (Chrome)'}</h3>
      ${ios ? '<ol><li>Открой ссылку в <b>Safari</b>.</li><li>Нажми кнопку «Поделиться» (квадрат со стрелкой вверх).</li><li>Выбери «<b>На экран «Домой»</b>».</li><li>Нажми «Добавить».</li></ol>'
        : '<ol><li>Открой ссылку в <b>Chrome</b>.</li><li>Нажми ⋮ (три точки справа сверху).</li><li>Выбери «<b>Установить приложение</b>» или «Добавить на главный экран».</li><li>Подтверди.</li></ol>'}
      <details style="margin-top:6px"><summary style="font-weight:800;cursor:pointer">${ios ? 'А если Android?' : 'А если iPhone?'}</summary>${ios ? '<ol><li>Chrome → ⋮ → «Установить приложение».</li></ol>' : '<ol><li>Safari → «Поделиться» → «На экран «Домой»».</li></ol>'}</details>
      <button class="btn wide" data-close style="margin-top:12px">Понятно</button>`);
  },
};
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); Install.ev = e; });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { try { navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (e) { } }

App.init();

</script>
</body></html>
